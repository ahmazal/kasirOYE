<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYE Coffee</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">OYE<span>Coffee</span></div>

      <div
        class="nav-item active"
        onclick="window.location.href = 'index.html'"
      >
        <img src="assets/dashboard.png" alt="Dashboard" class="icon" />
        <span>Home</span>
      </div>

      <div class="nav-item" onclick="window.location.href = 'menu.html'">
        <img src="assets/menu.png" alt="Menu" class="icon" />
        <span>Menu</span>
      </div>

      <div class="nav-item" onclick="window.location.href = 'transaksi.html'">
        <img src="assets/order.png" alt="Order" class="icon" />
        <span>Transaksi</span>
      </div>

      <div class="sidebar-bottom">
        <div class="nav-item" id="logoutBtn" style="cursor: pointer">
          <img src="assets/logout.png" alt="Logout" class="icon" />
          <span>Log Out</span>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <!-- TOPBAR -->
      <header class="topbar">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
        <h1>Menu</h1>
        <button class="cart-toggle-btn" id="cartToggleBtn" aria-label="Toggle cart">🛒</button>

        <div class="search">
          <input
            type="text"
            id="search-input"
            placeholder="Search menu..."
            oninput="filterMenu()"
          />

          <img src="assets/search.png" alt="Search" class="icon" />
        </div>
      </header>

      <!-- CONTENT -->
      <div class="content">
        <!-- MENU PANEL -->
        <div class="menu-panel">
          <div class="tabs">
            <div class="tab active" onclick="setTab(this, 'all')">All</div>

            <div class="tab" onclick="setTab(this, 'coffee')">Coffee</div>

            <div class="tab" onclick="setTab(this, 'non-coffee')">
              Non-Coffee
            </div>

            <div class="tab" onclick="setTab(this, 'food')">Food</div>

            <div class="tab" onclick="setTab(this, 'snack')">Snack</div>

          </div>

          <div class="section-title" id="section-title">All Menu</div>

          <div class="menu-grid" id="menu-grid">
            <!-- Menu otomatis dari menu.js -->
          </div>
        </div>

        <!-- CART PANEL -->
        <aside class="cart-panel">
          <div class="cart-header">
            <h2>Order Summary</h2>

            <span class="order-id" id="order-id"> Order #0001 </span>

            <div style="display:flex; gap:8px; align-items:center">
              <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
              <button class="close-cart-btn" id="closeCartBtn" aria-label="Close cart">✕</button>
            </div>
          </div>

          <!-- ORDER TYPE -->
          <div class="order-type">
            <button class="otype-btn active" onclick="setOrderType(this)">
              Delivery
            </button>

            <button class="otype-btn" onclick="setOrderType(this)">
              Dine In
            </button>

            <button class="otype-btn" onclick="setOrderType(this)">
              Takeaway
            </button>
          </div>

          <!-- CART ITEMS -->
          <div class="cart-items" id="cart-items">
            <div class="cart-empty">
              <div class="empty-icon">🛒</div>
              <p>
                Keranjang masih kosong.<br />
                Silakan tambahkan menu.
              </p>
            </div>
          </div>

          <!-- SUMMARY -->
          <div class="cart-summary" id="cart-summary" style="display: none">
            <div class="summary-row">
              <span>Items</span>
              <span id="s-items">0 Item</span>
            </div>

            <div class="summary-row">
              <span>Discount</span>
              <span id="s-discount">-Rp 0</span>
            </div>

            <div class="summary-row total">
              <span>Total</span>
              <span id="s-total">Rp 0</span>
            </div>

            <hr style="margin: 18px 0" />

            <!-- PAYMENT -->
            <div class="payment-box">
              <label>Metode Pembayaran</label>

              <select
                id="payment-method"
                class="payment-input"
                onchange="togglePaymentInput()"
              >
                <option value="tunai">Tunai</option>
                <option value="qris">QRIS</option>
                <option value="debit">Debit</option>
              </select>

              <label style="margin-top: 14px; display: block">
                Nominal Bayar
              </label>

              <input
                type="number"
                id="payment-amount"
                class="payment-input"
                placeholder="Rp 0"
                oninput="calculateChange()"
              />

              <div class="change-box">
                <strong id="change-text">Masukkan nominal pembayaran</strong>
              </div>
            </div>
          </div>

          <!-- BUTTON -->
          <button
            class="place-order"
            id="place-order-btn"
            disabled
            onclick="placeOrder()"
          >
            Bayar & Cetak Struk
          </button>
        </aside>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- JAVASCRIPT -->
    <script src="js/auth.js"></script>
    <script>
      requireLogin();
    </script>
    <script src="js/ui.js"></script>
    <script src="js/dataMenu.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
