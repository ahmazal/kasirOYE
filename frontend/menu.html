<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OYE Coffee - Menu</title>

    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <aside class="sidebar">

    <div class="logo">
        OYE<span>Coffee</span>
    </div>

    <div class="nav-item"
        onclick="window.location.href='index.html'">

        <img
            src="assets/dashboard.png"
            alt="Dashboard"
            class="icon">

        <span>Home</span>

    </div>

    <div class="nav-item active"
        onclick="window.location.href='menu.html'">

        <img
            src="assets/menu.png"
            alt="Menu"
            class="icon">

        <span>Menu</span>

    </div>

    <div class="nav-item"
        onclick="window.location.href='order.html'">

        <img
            src="assets/order.png"
            alt="Order"
            class="icon">

        <span>Order</span>

    </div>

    <div class="sidebar-bottom">

        <div class="nav-item">

            <img
                src="assets/logout.png"
                alt="Logout"
                class="icon">

            <span>Log Out</span>

        </div>

    </div>

</aside>

    <div class="main">

        <header class="topbar">

            <h1>Menu</h1>

            <div class="search">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search Menu..."
                    oninput="filterMenu()">
            </div>

        </header>

        <div class="content">

    <div class="menu-panel full-width">

        <div class="menu-actions">

            <button
                class="add-menu-btn"
                onclick="openAddModal()">

                + Add Menu

            </button>

        </div>

        <div class="tabs">

            <div class="tab active"
                 onclick="setTab(this,'all')">
                All
            </div>

            <div class="tab"
                 onclick="setTab(this,'coffee')">
                Coffee
            </div>

            <div class="tab"
                 onclick="setTab(this,'non-coffee')">
                Non Coffee
            </div>

            <div class="tab"
                 onclick="setTab(this,'food')">
                Food
            </div>

            <div class="tab"
                 onclick="setTab(this,'snack')">
                Snack
            </div>

            <div class="tab"
                 onclick="setTab(this,'dessert')">
                Dessert
            </div>

        </div>

        <h2
            class="section-title"
            id="section-title">

            All Menu

        </h2>

        <div
            class="menu-grid"
            id="menu-grid">

        </div>

    </div>

</div>


    <!-- MODAL CRUD -->

    <div
        id="menu-modal"
        class="modal">

        <div class="modal-content">

            <h2 id="modal-title">
                Add Menu
            </h2>

            <input
                type="hidden"
                id="menu-id">

            <input
                type="text"
                id="menu-name"
                placeholder="Menu Name">

            <input
                type="number"
                id="menu-price"
                placeholder="Price">

            <input
                type="text"
                id="menu-image"
                placeholder="Image URL">

            <select id="menu-category">

                <option value="coffee">
                    Coffee
                </option>

                <option value="non-coffee">
                    Non Coffee
                </option>

                <option value="food">
                    Food
                </option>

                <option value="snack">
                    Snack
                </option>

                <option value="dessert">
                    Dessert
                </option>

            </select>

            <div class="modal-buttons">

                <button onclick="saveMenu()">
                    Save
                </button>

                <button onclick="closeModal()">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    <!-- JS -->

    <script src="js/dataMenu.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/crud.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
