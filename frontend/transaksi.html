<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Transaksi - OYE Coffee</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/transaksi.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>

    <aside class="sidebar">
      <div class="logo">OYE<span>Coffee</span></div>

      <div class="nav-item" onclick="window.location.href='index.html'">
        <img src="assets/dashboard.png" alt="Dashboard" class="icon" />
        <span>Home</span>
      </div>

      <div class="nav-item" onclick="window.location.href='menu.html'">
        <img src="assets/menu.png" alt="Menu" class="icon" />
        <span>Menu</span>
      </div>

      <div class="nav-item active" onclick="window.location.href='transaksi.html'">
        <img src="assets/order.png" alt="Order" class="icon" />
        <span>Transaksi</span>
      </div>

      <div class="sidebar-bottom">
        <div class="nav-item" id="logoutBtn" style="cursor: pointer">
          <img src="assets/logout.png" alt="Logout" class="icon" />
          <span>Log Out</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
        <h1>Transaksi</h1>
        <div class="search">
          <input
            type="search"
            id="search-transaksi"
            placeholder="Cari no. transaksi..."
          />
          <img src="assets/search.png" alt="Search" class="icon" />
        </div>
      </header>

      <div class="content">
        <div class="menu-panel">

          <div class="transaksi-actions">
            <button class="refresh-btn" onclick="renderTransaksi()">Refresh</button>
            <div class="transaksi-summary">
              <span id="transaksi-count">Total transaksi: 0</span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="transaksi-table">
              <thead>
                <tr>
                  <th>No. Transaksi</th>
                  <th>Tanggal</th>
                  <th>Kasir</th>
                  <th>Pelanggan</th>
                  <th>Metode</th>
                  <th>Total</th>
                  <th>Bayar</th>
                  <th>Kembalian</th>
                </tr>
              </thead>
              <tbody id="transaksi-body"></tbody>
            </table>
          </div>

          <div id="transaksi-empty" class="empty-state" style="display: none">
            Tidak ada transaksi yang tersedia.
          </div>

        </div>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script src="js/auth.js"></script>
    <script>requireLogin();</script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/transaksi.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
